<!--
  Padel Mania. El club entregó el logo como JPG de 150 px, así que el favicon lleva el
  logo embebido como imagen en vez de dibujarlo en vectores: inventarle curvas a un logo
  ajeno es redibujarlo, y un logo redibujado deja de ser el del cliente.
  Si alguna vez llega el original en vectores, este archivo es el primero que se reemplaza.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Padel Mania">
  <rect width="64" height="64" rx="14" fill="#0d080c"/>
  <image x="2" y="2" width="60" height="60" href="data:image/png;base64,"/>
</svg>